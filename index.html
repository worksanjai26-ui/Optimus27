<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OPTIMUS '27 · KPR Institute of Engineering and Technology</title>
    <!-- Typography: Archivo Expanded (display/headings/numbers), Inter (body/labels) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=Inter:wght@400..700&display=swap" rel="stylesheet" />
    <!-- Preload the entry insignia so the ENTER button shows immediately on refresh -->
    <link rel="preload" as="image" href="/assets/logo-hd.webp" type="image/webp" fetchpriority="high" />
    <!-- Tailwind Play CDN: generates utility classes at runtime (incl. dynamic theme classes) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      html, body, #root { height: 100%; }
      body { margin: 0; background: #020617; }
      /* Font system: Inter = body/labels, Archivo Expanded = headings, wordmark and big numbers. */
      html, body {
        font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
        font-feature-settings: 'cv11', 'ss01', 'ss03';
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      .font-sans { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif !important; }
      /* Headings: wide, tight-tracked display face. */
      h1, h2, h3, h4 {
        font-family: 'Archivo', ui-sans-serif, system-ui, sans-serif !important;
        font-stretch: 110%;
        letter-spacing: -0.015em;
      }
      /* Technical/mono labels stay in the body face, with tabular figures. */
      .font-mono { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif !important; font-variant-numeric: tabular-nums; }
      /* Big data numbers (countdown, prices, stats): expanded display figures that don't jitter. */
      .font-num {
        font-family: 'Archivo', ui-sans-serif, system-ui, sans-serif !important;
        font-stretch: 112%;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.02em;
      }
      /* The OPTIMUS '27 wordmark everywhere. */
      .opt-word { font-family: 'Archivo', ui-sans-serif, system-ui, sans-serif !important; font-stretch: 125%; }
    </style>
  </head>
  <body>
    <!-- Instant branded splash: shows the logo + wordmark immediately on refresh while the
         app bundle (Three.js) loads; React removes it as soon as the real entry screen mounts. -->
    <div id="splash" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:radial-gradient(ellipse 60% 50% at 50% 42%, #0a1733, #02040a);transition:opacity .45s ease;">
      <img src="/assets/logo-hd.webp" alt="" width="150" height="150" style="width:clamp(96px,16vh,150px);height:auto;filter:drop-shadow(0 0 14px rgba(148,197,255,.25)) drop-shadow(0 10px 22px rgba(0,0,0,.75));animation:splashPulse 1.6s ease-in-out infinite;" />
      <div style="font-family:'Archivo',ui-sans-serif,sans-serif;font-stretch:125%;font-weight:800;letter-spacing:-.01em;font-size:clamp(1.9rem,6vw,3.1rem);color:#e8edf5;">OPTIMUS <span style="color:#fbbf24;">'27</span></div>
      <div style="font-family:'Inter',ui-sans-serif,sans-serif;font-size:11px;letter-spacing:.42em;color:#6b7a90;">INITIALIZING</div>
    </div>
    <style>@keyframes splashPulse{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}</style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
