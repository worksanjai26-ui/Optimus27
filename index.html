<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OPTIMUS '27 · KPR Institute of Engineering and Technology</title>
    <!-- Typography: Archivo Expanded (display/headings/numbers), Inter (body/labels) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Inter:wght@400..700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Preload the entry insignia so the ENTER button shows immediately on refresh -->
    <link rel="preload" as="image" href="/assets/logo-hd.webp" type="image/webp" fetchpriority="high" />
    <style>
      html, body, #root { height: 100%; }
      body { margin: 0; background: #020617; }
      /* Font system: Inter = body/labels, Archivo Expanded = headings, wordmark and big numbers. */
      html, body {
        font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
        font-feature-settings: 'cv11', 'ss01', 'ss03';
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      .font-sans { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif !important; }
      /* Headings: wide, tight-tracked display face. */
      h1, h2, h3, h4 {
        font-family: 'Archivo', ui-sans-serif, system-ui, sans-serif !important;
        font-stretch: 110%;
        letter-spacing: -0.015em;
      }
      /* Technical/mono labels stay in the body face, with tabular figures. */
      .font-mono { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif !important; font-variant-numeric: tabular-nums; }
      /* Big data numbers (countdown, prices, stats): expanded display figures that don't jitter. */
      .font-num {
        font-family: 'Archivo', ui-sans-serif, system-ui, sans-serif !important;
        font-stretch: 112%;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.02em;
      }
      /* Header navigation: technical monospace. */
      .font-plex { font-family: 'IBM Plex Mono', ui-monospace, monospace !important; }
      /* The OPTIMUS '27 wordmark everywhere. */
      .opt-word { font-family: 'Archivo', ui-sans-serif, system-ui, sans-serif !important; font-stretch: 125%; }
    </style>
  </head>
  <body>
    <!-- Intro: plain HTML + CSS, so it shows the instant the page opens, before any JS arrives.
         The Autobot insignia sits still in the centre while a gold chakra spins around it and a
         loading bar runs below. Both animations are pure transforms, so the GPU keeps them smooth
         even while the app bundle and 3D scene load. App.tsx fades it out once everything is ready. -->
    <style>
      #splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: clamp(22px, 4vh, 36px); background: radial-gradient(ellipse 60% 50% at 50% 45%, #0a1733 0%, #02040a 70%); transition: opacity .5s ease; }
      #splash.sp-out { opacity: 0; pointer-events: none; }
      #splash .sp-stage { position: relative; width: min(46vmin, 280px); aspect-ratio: 1; }
      #splash .sp-chakra { position: absolute; inset: 0; width: 100%; height: 100%; will-change: transform; animation: spSpin 2.4s linear infinite; }
      #splash .sp-logo { position: absolute; left: 27%; top: 27%; width: 46%; height: 46%; object-fit: contain;
        filter: drop-shadow(0 0 14px rgba(148,197,255,.3)); }
      #splash .sp-load { width: min(220px, 52vw); height: 3px; border-radius: 3px; background: rgba(148,163,184,.18); overflow: hidden; }
      #splash .sp-load b { display: block; width: 38%; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #facc15, #fde68a);
        will-change: transform; animation: spLoad 1.15s ease-in-out infinite; }
      @keyframes spSpin { to { transform: rotate(360deg); } }
      @keyframes spLoad { 0% { transform: translateX(-100%); } 100% { transform: translateX(265%); } }
      @media (prefers-reduced-motion: reduce) { #splash .sp-chakra, #splash .sp-load b { animation-duration: 6s; } }
    </style>
    <div id="splash" role="status" aria-label="Loading OPTIMUS '27">
      <div class="sp-stage" aria-hidden="true">
        <svg class="sp-chakra" viewBox="0 0 200 200" fill="none">
          <circle cx="100" cy="100" r="97" stroke="rgba(250,204,21,.85)" stroke-width="2" />
          <circle cx="100" cy="100" r="91" stroke="rgba(250,204,21,.45)" stroke-width="5" stroke-dasharray="1.2 4.75" />
          <circle cx="100" cy="100" r="86" stroke="rgba(250,204,21,.35)" stroke-width=".8" />
          <g stroke="rgba(250,204,21,.22)" stroke-width="1"><line x1="100" y1="100" x2="186.00" y2="100.00" /><line x1="100" y1="100" x2="183.07" y2="122.26" /><line x1="100" y1="100" x2="174.48" y2="143.00" /><line x1="100" y1="100" x2="160.81" y2="160.81" /><line x1="100" y1="100" x2="143.00" y2="174.48" /><line x1="100" y1="100" x2="122.26" y2="183.07" /><line x1="100" y1="100" x2="100.00" y2="186.00" /><line x1="100" y1="100" x2="77.74" y2="183.07" /><line x1="100" y1="100" x2="57.00" y2="174.48" /><line x1="100" y1="100" x2="39.19" y2="160.81" /><line x1="100" y1="100" x2="25.52" y2="143.00" /><line x1="100" y1="100" x2="16.93" y2="122.26" /><line x1="100" y1="100" x2="14.00" y2="100.00" /><line x1="100" y1="100" x2="16.93" y2="77.74" /><line x1="100" y1="100" x2="25.52" y2="57.00" /><line x1="100" y1="100" x2="39.19" y2="39.19" /><line x1="100" y1="100" x2="57.00" y2="25.52" /><line x1="100" y1="100" x2="77.74" y2="16.93" /><line x1="100" y1="100" x2="100.00" y2="14.00" /><line x1="100" y1="100" x2="122.26" y2="16.93" /><line x1="100" y1="100" x2="143.00" y2="25.52" /><line x1="100" y1="100" x2="160.81" y2="39.19" /><line x1="100" y1="100" x2="174.48" y2="57.00" /><line x1="100" y1="100" x2="183.07" y2="77.74" /></g>
          <circle cx="100" cy="100" r="97" stroke="#fde68a" stroke-width="3" stroke-linecap="round" stroke-dasharray="60 549.5" />
        </svg>
        <img class="sp-logo" src="/assets/logo-hd.webp" alt="" width="240" height="240" />
      </div>
      <div class="sp-load" aria-hidden="true"><b></b></div>
    </div>
    <script>window.__introStart = performance.now();</script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
