<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OPTIMUS '27 · KPR Institute of Engineering and Technology</title>
    <!-- Transformers typography: Chakra Petch (display/headings), Teko (big numbers), Barlow Semi Condensed (body/labels) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700;800&family=Chakra+Petch:wght@400;500;600;700&family=Teko:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Preload the entry insignia so the ENTER button shows immediately on refresh -->
    <link rel="preload" as="image" href="/assets/logo-hd.webp" type="image/webp" fetchpriority="high" />
    <!-- Tailwind Play CDN: generates utility classes at runtime (incl. dynamic theme classes) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      html, body, #root { height: 100%; }
      body { margin: 0; background: #020617; }
      /* Font system: Barlow Semi Condensed = body/labels, Orbitron = display headings, Teko = big numbers. */
      html, body { font-family: 'Barlow Semi Condensed', ui-sans-serif, system-ui, sans-serif; }
      .font-sans { font-family: 'Barlow Semi Condensed', ui-sans-serif, system-ui, sans-serif !important; }
      /* Headings + the wordmark take the squared cyber display face. */
      h1, h2, h3, h4 { font-family: 'Chakra Petch', ui-sans-serif, system-ui, sans-serif !important; }
      /* Technical/mono labels stay readable in the condensed body face. */
      .font-mono { font-family: 'Barlow Semi Condensed', ui-sans-serif, system-ui, sans-serif !important; }
      /* Big data numbers (countdown, prices, stats) use the tall condensed numeral face. */
      .font-num { font-family: 'Teko', ui-sans-serif, system-ui, sans-serif !important; }
      /* The OPTIMUS '27 wordmark everywhere keeps Chakra Petch regardless of other heading fonts. */
      .opt-word { font-family: 'Chakra Petch', ui-sans-serif, system-ui, sans-serif !important; }
    </style>
  </head>
  <body>
    <!-- Instant branded splash: shows the logo + wordmark immediately on refresh while the
         app bundle (Three.js) loads; React removes it as soon as the real entry screen mounts. -->
    <div id="splash" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:radial-gradient(ellipse 60% 50% at 50% 42%, #0a1733, #02040a);transition:opacity .45s ease;">
      <img src="/assets/logo-hd.webp" alt="" width="150" height="150" style="width:clamp(96px,16vh,150px);height:auto;filter:drop-shadow(0 0 14px rgba(148,197,255,.25)) drop-shadow(0 10px 22px rgba(0,0,0,.75));animation:splashPulse 1.6s ease-in-out infinite;" />
      <div style="font-family:'Chakra Petch',ui-sans-serif,sans-serif;font-weight:700;letter-spacing:.03em;font-size:clamp(1.9rem,6vw,3.1rem);color:#e8edf5;">OPTIMUS <span style="color:#fbbf24;">'27</span></div>
      <div style="font-family:ui-sans-serif,sans-serif;font-size:11px;letter-spacing:.42em;color:#6b7a90;">INITIALIZING</div>
    </div>
    <style>@keyframes splashPulse{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}</style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
